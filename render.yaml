databases:
  - name: tedorii-db
    plan: free
    region: singapore

services:
  - type: web
    name: tedorii-rails
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: RAILS_ENV
        value: staging
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tedorii-db
          property: connectionString
